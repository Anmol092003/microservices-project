# ===============================
# = Server Config
# ===============================
server.port=8080

# ===============================
# = DataSource Config (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/busdb
spring.datasource.username=postgres
spring.datasource.password=321
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# = JPA / Hibernate
# ===============================
# Automatically update schema (create | create-drop | update | validate | none)
spring.jpa.hibernate.ddl-auto=update

# Show SQL in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialect for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# = Logging (Optional but useful for debugging)
# ===============================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
eureka.client.enabled=false
